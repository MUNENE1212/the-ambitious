name: Deploy

# AUTO-DEPLOY IS OFF, DELIBERATELY.
#
# This used to fire on every successful CI run on `main`, with the `production`
# environment carrying zero protection rules — so `git push` deployed straight to
# the box. The health check only fetched `/`, which renders fine without
# credentials, so a deploy where every member login returns 503 reported GREEN.
#
# Re-enable by uncommenting the workflow_run block below, and only after
# phases 0-4 of docs/DEPLOYMENT-PLAN.md have run clean at least twice.
#
# workflow_run:
#   workflows: [CI]
#   types: [completed]
#   branches: [main]
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/SHA) to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      # Server-only. These are what let /api/* reach Firestore through the Admin
      # SDK. Without them the app boots and every login returns 503 — which is
      # why the health check below probes auth and not just `/`.
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      # NOT FIREBASE_PRIVATE_KEY. It holds literal newlines and appleboy/ssh-action
      # is known to mangle multi-line values passed through `envs`. A truncated
      # key fails exactly like a missing one — isAdminConfigured() returns false
      # and login 503s — but only AFTER a deploy reported success. It goes to a
      # root-owned file on the VPS instead, via the step below.
    steps:
      - name: Resolve target SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
            echo "value=$(git ls-remote https://github.com/${{ github.repository }}.git "$REF" | head -1 | cut -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: |
          npm run lint:strict
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          # Refresh contents inside the standalone bundle:
          #   .next/static/  -> static assets (not included by next build)
          #   public/        -> public files (not auto-copied in Next 16 standalone)
          # Use `cp -r src/. dst/` to overwrite in place (not nest into src/)
          mkdir -p .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/. .next/standalone/public/
          node scripts/stamp-sw-cache.mjs .next/standalone/public/sw.js

          # Bundle layout the VPS expects (paths in the tarball):
          #   .next/standalone/server.js
          #   .next/standalone/public/sw.js
          #   .next/standalone/.next/static
          #   ecosystem.config.cjs
          #   deploy-remote.sh
          tar -czf deploy.tar.gz \
            -C "$GITHUB_WORKSPACE" \
            .next/standalone \
            ecosystem.config.cjs \
            scripts/deploy-remote.sh

      - name: Extract deploy-remote.sh for VPS use
        run: cp scripts/deploy-remote.sh deploy-remote.sh

      - name: Verify bundle layout
        run: |
          set -euo pipefail

          # List once into a file. Piping tar straight into `head`/`grep -q`
          # makes the reader exit early, which SIGPIPEs tar (or sort) and, under
          # `set -o pipefail`, fails the step or reports a present path as
          # missing. `sed -n` reads to EOF, so it never closes the pipe early.
          tar -tzf deploy.tar.gz > bundle-list.txt

          echo "Tarball contents (first 30):"
          sort bundle-list.txt | sed -n '1,30p'

          # Hard-fail on missing critical paths so we never ship a broken bundle.
          # Paths match what tar lists: no leading ./, directories keep a
          # trailing slash, so accept either spelling.
          for required in \
            '.next/standalone/server.js' \
            '.next/standalone/public/sw.js' \
            '.next/standalone/.next/static' \
            'ecosystem.config.cjs' \
            'scripts/deploy-remote.sh'
          do
            if ! grep -qx -e "$required" -e "$required/" bundle-list.txt; then
              echo "ERROR: required path '$required' missing from tarball" >&2
              exit 1
            fi
          done
          echo "Bundle layout OK"

      - name: Copy artifacts to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /opt/the-ambitious

      - name: Extract deploy-remote.sh on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            mkdir -p /opt/the-ambitious
            cd /opt/the-ambitious
            tar -xzf deploy.tar.gz scripts/deploy-remote.sh
            mv scripts/deploy-remote.sh deploy-remote.sh
            chmod +x deploy-remote.sh

      - name: Write server secrets to a root-owned env file
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          # The key is stored base64-encoded in the FIREBASE_PRIVATE_KEY secret.
          # A PEM key spans many lines; passing that through `envs` is exactly
          # how appleboy/ssh-action truncates it, and a truncated key fails
          # identically to a missing one (login 503s) but only after the deploy
          # reported success. Base64 makes it one line, so there is nothing to
          # mangle and nothing for the shell to misparse.
          #
          # `umask 077` is set BEFORE the redirect creates the file, so the key
          # is never briefly world-readable.
          script: |
            set -euo pipefail
            umask 077
            ENV_PATH=/opt/the-ambitious/.env.production
            mkdir -p /opt/the-ambitious
            {
              printf 'FIREBASE_PROJECT_ID=%s\n' '${{ secrets.FIREBASE_PROJECT_ID }}'
              printf 'FIREBASE_CLIENT_EMAIL=%s\n' '${{ secrets.FIREBASE_CLIENT_EMAIL }}'
              printf 'FIREBASE_PRIVATE_KEY_B64=%s\n' '${{ secrets.FIREBASE_PRIVATE_KEY_B64 }}'
            } > "$ENV_PATH"
            chmod 600 "$ENV_PATH"
            echo "wrote $ENV_PATH ($(wc -l < "$ENV_PATH") lines, mode $(stat -c %a "$ENV_PATH"))"

            # Fail loudly here rather than deploying a 503 app. An empty or
            # undecodable key is caught now, not by a member's login attempt.
            if ! printf '%s' '${{ secrets.FIREBASE_PRIVATE_KEY_B64 }}' | base64 -d 2>/dev/null | grep -q 'BEGIN PRIVATE KEY'; then
              echo "::error::FIREBASE_PRIVATE_KEY_B64 is empty or is not a base64-encoded PEM key."
              echo "::error::Generate it with: base64 -w0 service-account.json-key.pem"
              exit 1
            fi

      - name: Atomic deploy + health check
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          # appleboy/ssh-action does not forward runner env vars automatically —
          # without this, $SHORT_SHA is unset on the VPS and `set -u` aborts the
          # deploy before deploy-remote.sh ever runs.
          envs: SHORT_SHA
          script: |
            set -euo pipefail
            cd /opt/the-ambitious
            export PORT=3005
            export TARBALL=/opt/the-ambitious/deploy.tar.gz
            bash /opt/the-ambitious/deploy-remote.sh "$SHORT_SHA"

      - name: Cleanup VPS bundle
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -f /opt/the-ambitious/deploy.tar.gz

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy summary"
            echo ""
            echo "- Commit: \`${{ steps.sha.outputs.value }}\`"
            echo "- Result: ${{ job.status }}"
            echo "- Run: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"